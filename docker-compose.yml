services:
  atlas-mcp:
    build: .
    image: atlas-mcp:local
    container_name: atlas-mcp
    restart: unless-stopped
    ports:
      - "7784:7784"
    environment:
      # Timezone reminders and the nightly groom run in. Any IANA zone name.
      - ATLAS_TZ=UTC
    # Optional: create .env from .env.example to set your own tokens.
    # Without it, Atlas generates tokens on first start and prints them
    # (docker compose logs atlas-mcp).
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
